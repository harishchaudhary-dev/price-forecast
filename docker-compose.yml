# docker compose up --build
# Then train + activate a model:
#   docker compose exec django python manage.py train_model --data ../data/<your>.csv --activate
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forecast
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast"]
      interval: 5s

  fastapi:
    build: { context: ., dockerfile: Dockerfile.fastapi }
    environment:
      MODELS_DIR: /models
      API_KEY: ${API_KEY:-dev-key}
      CORS_ORIGINS: http://localhost:3000
    volumes: [models:/models]
    ports: ["8001:8001"]

  django:
    build: { context: ., dockerfile: Dockerfile.django }
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django
      POSTGRES_DB: forecast
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      MODELS_DIR: /models
      FORECAST_BACKEND: ${FORECAST_BACKEND:-local}
      FASTAPI_URL: http://fastapi:8001
      API_KEY: ${API_KEY:-dev-key}
    volumes: [models:/models]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      fastapi: { condition: service_started }

volumes:
  pgdata:
  models:
